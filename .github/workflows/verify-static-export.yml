name: Validate static export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Verify export files
        run: |
          test -f out/index.html
          test -f out/404/index.html
          test -f out/sitemap.xml
          test -f out/robots.txt
